services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      DB_HOST: db
      MAIL_HOST: mailpit
      S3_ENDPOINT: http://minio:9000
      REDIS_HOST: redis
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
      - nestjs-api-dist:/home/node/app/dist
      - nestjs-api-node-modules:/home/node/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  media-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    volumes:
      - .:/home/node/app
    env_file: .env
    environment:
      DB_HOST: db
      S3_ENDPOINT: http://minio:9000
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
      - MINIO_API_CORS_ALLOW_ORIGIN=*
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: ["/bin/sh", "/scripts/minio-init.sh"]
    volumes:
      - ./scripts:/scripts:ro

volumes:
  minio-data:
  nestjs-api-dist:
  nestjs-api-node-modules:
